name: Auto Publish SEO/GEO Matrix Article

on:
  schedule:
    # Run every 4 days at 02:00 UTC (10:00 AM CST)
    - cron: '0 2 */4 * *'
  workflow_dispatch:
    # Allow manual triggering at any time from GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: auto-publish-matrix
  cancel-in-progress: false

jobs:
  publish-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Generate SEO/GEO Matrix Article via DeepSeek API
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node scripts/auto-publish-matrix.js

      - name: Verify Static Build & Search Indexing
        run: |
          npm run build

      - name: Commit and Push New Article (Trigger Production CI/CD)
        env:
          NEW_SLUG: ${{ steps.generate.outputs.slug }}
          NEW_TITLE: ${{ steps.generate.outputs.title }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/content/posts/ src/config/site.ts
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new changes detected to commit."
            exit 0
          fi
          
          # Commit message strictly excludes [skip ci] to trigger automated production deployment
          COMMIT_MSG="feat(blog): publish new SEO/GEO matrix article [${NEW_SLUG}]"
          echo "Commit message: $COMMIT_MSG"
          
          git commit -m "$COMMIT_MSG"
          git push origin main

      - name: Submit Canonical URLs to Bing / IndexNow
        run: |
          npm run indexnow || echo "IndexNow submission step completed."
